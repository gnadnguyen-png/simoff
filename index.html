<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimOff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: the office room (2.5D illustration) is the stage; inbox and task ledger sit beside it; the day's log runs underneath. */
:root{
  --paper:#f6f2ea; --sheet:#ffffff; --ink:#1f2a36; --ink-2:#5d6673; --line:#e4dacb; --wash:#f1eadf;
  --accent:#1f5f9e; --accent-ink:#ffffff; --stamp:#c0262d; --sun:#f2b632;
  --xl:#1d6f42; --wd:#2b579a; --ok:#21804a; --warn:#b36b00; --bad:#c0262d;
  --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --doc:"Noto Serif","Times New Roman",Times,serif;
  --r:12px; --shadow:0 1px 2px rgba(80,60,30,.06),0 6px 18px rgba(80,60,30,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1722; --sheet:#172231; --ink:#e3eaf2; --ink-2:#9db0c5; --line:#2a3a4d; --wash:#1d2a3a;
  --accent:#72a9ea; --accent-ink:#0b1420; --stamp:#ef6b6f; --sun:#f2c35a; --xl:#4cb87a; --wd:#7aa5ea; --ok:#4cb87a; --warn:#e3a33a; --bad:#ef6b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1722; --sheet:#172231; --ink:#e3eaf2; --ink-2:#9db0c5; --line:#2a3a4d; --wash:#1d2a3a;
  --accent:#72a9ea; --accent-ink:#0b1420; --stamp:#ef6b6f; --sun:#f2c35a; --xl:#4cb87a; --wd:#7aa5ea; --ok:#4cb87a; --warn:#e3a33a; --bad:#ef6b6f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--ui);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-block:4px 12px}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font:800 22px/1 var(--ui);letter-spacing:-.02em}
.brand b span{color:var(--accent)}
.brand small{color:var(--ink-2);font-size:12.5px}
.day{display:flex;flex-direction:column;line-height:1.25;padding-left:14px;border-left:1px solid var(--line)}
.day small{color:var(--ink-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}
.day strong{font-size:15px}
.meter{display:flex;flex-direction:column;gap:4px;min-width:170px}
.meter small{color:var(--ink-2);font-size:12px;display:flex;justify-content:space-between;gap:8px}
.bar{height:7px;border-radius:4px;background:var(--wash);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.spacer{flex:1}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}}
/* Stage */
.stage{background:linear-gradient(#e9eef2,#f6f2ea);border-radius:16px;border:1px solid var(--line);overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto}
.pan{overflow:hidden;position:relative;height:min(72vh,720px);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:linear-gradient(#e9eef2,#f6f2ea)}
.pan.grab{cursor:grabbing}.pan.grab *{cursor:grabbing!important}
.pan svg{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0}
@media (max-width:760px){.pan{height:62vh}}
.zoom{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.zoom .btn{background:rgba(255,255,255,.92);min-width:34px;font-weight:700}
.legs.moving rect:nth-child(odd){animation:stepA .36s ease-in-out infinite alternate}
.legs.moving rect:nth-child(even){animation:stepB .36s ease-in-out infinite alternate}
@keyframes stepA{to{transform:translateY(-4px)}}@keyframes stepB{from{transform:translateY(-4px)}to{transform:translateY(0)}}
.hint:empty{display:none}.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:#4a5b6c;background:rgba(255,255,255,.75);padding:3px 9px;border-radius:12px}
@media (max-width:600px){.hint{position:static;display:block;border-radius:0}}
.who,.hot{cursor:pointer}
.dbar{position:absolute;top:10px;left:10px;right:170px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:rgba(255,255,255,.95);border:1px solid #9fc0e6;border-radius:12px;padding:6px 8px;box-shadow:0 4px 14px rgba(20,40,70,.12)}
.dbar[hidden],.dbagp[hidden]{display:none}
.dname{font-weight:700;font-size:13px;color:#1f3f66;margin-right:auto;padding:0 4px;flex:1 1 90px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbagp{position:absolute;top:calc(100% + 6px);left:0;width:300px;max-width:100%;max-height:min(420px,50vh);overflow:auto;background:#fff;border:1px solid #9fc0e6;border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(20,40,70,.18);color:#22313f}
.dbagp h4{margin:4px 0 6px;font-size:13px}.dbagp .muted{font-size:12.5px;color:#5b6b7b;margin:0 0 8px}
.dbagp .bi{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dashed #dde6ef;font-size:13px}
.dbagp .cat{display:flex;flex-wrap:wrap;gap:6px}
.designing .pan [data-obj]{cursor:move}.designing .pan .who,.designing .pan .hot{cursor:move}
#scene .obj.drop{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px #23a26d)}
.liftGhost{position:fixed;z-index:60;pointer-events:none;filter:drop-shadow(0 10px 8px rgba(30,40,50,.28))}body.lifting,body.lifting *{cursor:grabbing!important}
#scene .obj.sel{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #2f7de1)}#scene .obj.bad{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px #e5484d)}
.designing #btnDesign{box-shadow:0 0 0 3px rgba(47,125,225,.3)}
.tplck{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap;color:var(--ink-2)}
.saveState{font-size:10.5px;color:var(--ok);border:1px solid currentColor;border-radius:999px;padding:0 7px;margin-left:8px;white-space:nowrap;text-transform:none;letter-spacing:0}
.saveState::before{content:'✓ '}.saveState.bad{color:var(--warn)}.saveState.bad::before{content:'! '}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg,#f6f2ea);z-index:50;font-size:15px;color:var(--ink-2,#555)}
/* the overtime (green) and urgent call (red) switches: an outline when off; solid, glowing, with a blinking light while on */
.btn.ot{--c:var(--ok);--g:33,128,74;--a:#2b9a5c;--b:#1c7344;color:var(--c);border:2px solid var(--c);font-weight:800;letter-spacing:.01em;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding-inline:10px}
.btn.ot.call{--c:var(--bad);--g:224,52,60;--a:#e0343c;--b:#b51f27}
.btn.ot:hover{border-color:var(--c);background:rgba(var(--g),.07)}
.otDot{width:9px;height:9px;border-radius:50%;border:2px solid var(--c);background:transparent}
.btn.ot.on{background:linear-gradient(var(--a),var(--b));color:#fff;border-color:var(--b);animation:otGlow 1.6s ease-in-out infinite}
.btn.ot.call.on{animation-duration:.8s}
.btn.ot.on .otDot{background:#fff;border-color:#fff;animation:otBlink 1s steps(2,start) infinite}
@keyframes otGlow{0%,100%{box-shadow:0 0 0 0 rgba(var(--g),.55)}50%{box-shadow:0 0 0 7px rgba(var(--g),0)}}
@keyframes otBlink{to{visibility:hidden}}
@media (max-width:760px){.dbar{right:10px;top:50px}}
.who:hover .body,.who:focus .body{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 6px #1f5f9e)}
.who:focus{outline:none}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.arm{transform-box:fill-box;transform-origin:50% 0}
.typing .arm.l{animation:typeL .28s infinite alternate}
.typing .arm.r{animation:typeR .28s .14s infinite alternate}
@keyframes typeL{to{transform:rotate(-9deg)}}
@keyframes typeR{to{transform:rotate(9deg)}}
.zz{animation:zz 2.4s linear infinite;opacity:0}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
.file{animation:hop 1s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-7px)}}
.dots circle{animation:dot 1s infinite}
.dots circle:nth-child(2){animation-delay:.2s}.dots circle:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{opacity:.2}}
.fan{animation:spin .6s linear infinite;transform-box:fill-box;transform-origin:center}.fan.fast{animation-duration:.15s}
.wswing{animation:wswing 2.4s ease-out;transform-box:view-box;transform-origin:20px -173px}@keyframes wswing{0%{transform:rotate(0)}12%{transform:rotate(9deg)}30%{transform:rotate(-7deg)}50%{transform:rotate(4.5deg)}70%{transform:rotate(-2.5deg)}86%{transform:rotate(1deg)}100%{transform:rotate(0)}}
.wflip{animation:wflip .9s ease-in forwards;transform-box:fill-box;transform-origin:50% 0}@keyframes wflip{0%{transform:scaleY(1);opacity:1}80%{opacity:1}100%{transform:scaleY(-.25) skewX(-8deg);opacity:0}}
.wspin{animation:spin .7s linear 4;transform-box:fill-box;transform-origin:center}
.wgleam{animation:wgleam 1.1s ease-in-out 2}@keyframes wgleam{from{transform:translateX(-10px)}to{transform:translateX(150px)}}
.pring.fresh{animation:pfade .2s ease-out}.popt{cursor:pointer}.pring.fresh .popt{animation:pop .28s cubic-bezier(.3,1.5,.6,1) both;transform-box:fill-box;transform-origin:center}.popt:hover circle{stroke:#2f7de1}.popt.off{opacity:.45}.calnav{display:flex;gap:6px;justify-content:center;margin-bottom:8px}.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:14px}.calh{text-align:center;font-size:12px;font-weight:700;color:var(--ink-2)}.cald{min-height:76px;display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);font:inherit;font-size:11px;cursor:pointer;min-width:0}.cald b{font-size:12px}.cald.we{background:rgba(120,140,160,.08)}.cald.out{opacity:.4}.cald.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.cald.pick{background:rgba(47,125,225,.12)}.ctrip{display:block;border-radius:5px;padding:1px 5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.cdue{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}.trow small{display:block;color:var(--ink-2)}.trow .acts{display:flex;gap:6px}.tripf{margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:12px}.lkrow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.lkrow button{min-width:34px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:17px;background:var(--sheet);font:inherit;font-size:13px;cursor:pointer}.lkrow button.sw{width:34px;padding:0}.lkrow button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.lkwrap{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:start}.lkwrap svg{width:110px;height:170px;background:var(--sheet);border:1px solid var(--line);border-radius:12px}.dlv{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.dlv label{display:flex;gap:6px;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:18px;background:var(--sheet);cursor:pointer}.frow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}.frow small{display:block;color:var(--ink-2)}@keyframes pfade{from{opacity:0}}@keyframes pop{from{opacity:0;scale:.3}}
.sway{animation:sway .7s ease-in-out 5 alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
#scene .obj.pk{cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fly{0%{transform:translate(-60px,24px)}100%{transform:translate(260px,-26px)}}
@media (prefers-reduced-motion:reduce){.bob,.eye,.typing .arm,.zz,.file,.dots circle,.fan,.sway,.wswing,.wflip,.wspin,.wgleam,.btn.ot.on,.btn.ot.on .otDot{animation:none!important}.zz{opacity:1}}
/* Side panels */
.panel h2 .btn{white-space:nowrap}
.panel h2 .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.panel h2{font:700 15px/1.2 var(--ui);margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 small{font:500 12px var(--ui);color:var(--ink-2)}
.side{display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:8px}
.stack.scroll{max-height:340px;overflow-y:auto;padding-right:4px;overscroll-behavior:contain}
.chatlog{max-height:260px;min-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 2px 6px;overscroll-behavior:contain}
.cm{max-width:88%;padding:6px 10px;border-radius:12px;font-size:13px;line-height:1.4;display:flex;flex-direction:column;gap:2px}
.cm.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.cm.them{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.cm b{font-size:12px}.cm time{font-size:10.5px;opacity:.7;align-self:flex-end}
.side.fit{height:var(--sideH)}
.side.fit>.panel{min-height:0;display:flex;flex-direction:column}
.side.fit{gap:12px}
.side.fit>.panel:first-child{flex:0 1 auto;max-height:24%}
.side.fit>.panel:nth-child(2){flex:1 1 0;min-height:150px}
.side.fit>.panel.chat{flex:0 1 auto;max-height:40%}
.side.fit>.panel>.stack{flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto;padding-right:4px;overscroll-behavior:contain}
.side.fit .chatlog{flex:1 1 auto;min-height:40px;max-height:none}
.chatbar{display:flex;gap:6px;align-items:flex-end;margin-top:6px}
.chatbar textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font:inherit;font-size:13px;background:var(--sheet);color:inherit}
.empty{color:var(--ink-2);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.memo{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.memo .from{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.memo p{margin:0;font-family:var(--doc);font-size:13.5px}
.memo .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.task{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;text-align:left;width:100%;align-items:center}
button.task:hover{border-color:var(--accent)}
.task .t{font-weight:600;line-height:1.3;font-size:13.5px}
.task .m{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-2)}
.mini{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;grid-row:span 2}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:0 5px;border-radius:4px;border:1px solid currentColor}
.chip.xlsx{color:var(--xl)} .chip.docx{color:var(--wd)}
.pill{font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--wash);color:var(--ink-2)}
.pill.late{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.go{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:600}
.stars{color:var(--sun);letter-spacing:1px}
.log{margin-top:18px}
.feed{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);max-height:260px;overflow:auto}
.ent{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding:7px 14px;border-bottom:1px solid var(--wash);font-size:13px}
.ent:last-child{border-bottom:0}
.ent time{color:var(--ink-2);font-size:12px}
.ent b{font-weight:600}
.ent.bad{color:var(--bad)} .ent.good b{color:var(--ok)} .ent.warn b{color:var(--warn)}
/* Dialogs */
.veil{position:fixed;inset:0;background:rgba(10,20,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 12px 24px;overflow:auto;z-index:20}
.dlg{background:var(--paper);border:1px solid var(--line);border-radius:14px;width:min(980px,100%);display:flex;flex-direction:column}
.dlg.narrow{width:min(600px,100%)}
.dlg header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg header h3{margin:0;font:700 18px/1.25 var(--ui);text-wrap:balance}
.dlg header p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.revsrc{border:1px dashed #c4d2de;border-radius:10px;padding:8px 12px}.revsrc summary{cursor:pointer;font-weight:600;font-size:14px;color:#1f5f9e}.revsrc[open] summary{margin-bottom:8px}.revsrc .f{margin-top:8px}
.dlg .body{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dlg footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.dlg footer .cancel{margin-right:auto}.dlg footer .cancel.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--ink-2);padding:2px 6px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:500}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt small{display:block;color:var(--ink-2);font-size:12px;line-height:1.35}
.att{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.att .an{display:flex;flex-direction:column;min-width:0}.att .an b{font-weight:600;overflow-wrap:anywhere}.att .an small{color:var(--ink-2);font-size:12px}
.att select{border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:3px 6px;font-size:12.5px}
.chip.pdf{color:var(--bad)}
.face{flex:none;background:#e7eef4;border-radius:50%}
.prof{display:flex;gap:14px;align-items:center}
.srow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.srow .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.srow .fields .wide{grid-column:1/-1}
.note{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--wash);color:var(--ink-2)}
.note.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.note b{color:var(--ink)}
.rate{display:flex;gap:2px;align-items:center}
.rate button{border:0;background:none;font-size:26px;line-height:1;color:var(--line);padding:0 2px}
.rate button.on{color:var(--sun)}
/* Spreadsheet preview */
.fx{display:flex;border:1px solid var(--line);border-radius:6px;background:var(--sheet);font-size:13px;overflow:hidden}
.fx span{padding:5px 10px;border-right:1px solid var(--line);color:var(--ink-2);min-width:62px;font-weight:600}
.fx code{padding:5px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;overflow:auto}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);border-bottom:0;background:var(--wash);border-radius:6px 6px 0 0;padding:4px 12px;font-size:12.5px}
.tabs button[aria-selected="true"]{background:var(--sheet);font-weight:600;color:var(--xl)}
.xl{overflow:auto;border:1px solid var(--line);background:#fff;max-height:58vh}
.xl table{border-collapse:collapse;font:12.5px/1.35 Arial,Helvetica,sans-serif;color:#1b1b1b}
.xl th{background:#eef1f4;color:#555;font-weight:500;border:1px solid #d4d8dd;padding:2px 6px;position:sticky;top:0;z-index:1}
.xl th.rn{position:sticky;left:0;z-index:2;min-width:34px}
.xl td{border:1px solid #e3e6ea;padding:3px 6px;white-space:nowrap;cursor:cell}
.xl td.sel{outline:2px solid #1d6f42;outline-offset:-2px}
.xl td.n{text-align:right}
.xl td.h{background:#dce6f2;font-weight:700;text-align:center;white-space:normal}
.xl td.t{background:#fff2cc;font-weight:700}
.xl td.ti{font-weight:700;font-size:15px;color:#1f3a5f;text-align:center}
.xl td.st{font-style:italic;color:#555;text-align:center;white-space:normal}
.xl td.b{font-weight:700}
.xl td.w{white-space:normal;min-width:180px}
/* Word preview */
.wd{background:#e2e6ea;padding:18px 10px;overflow:auto;max-height:62vh;border-radius:8px}
.page{background:#fff;color:#111;width:min(100%,720px);margin:0 auto;padding:44px 40px 56px 56px;font:15px/1.5 var(--doc);box-shadow:0 1px 4px rgba(0,0,0,.18);position:relative}
@media (max-width:600px){.page{padding:24px 18px}}
.page .qh{display:grid;grid-template-columns:2fr 3fr;gap:10px;text-align:center;font-size:13px;line-height:1.35;margin-bottom:18px}
.page .qh b,.page .qh span{display:block}
.page .kg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;margin:4px 0 12px 14%}
.page .sg b.c{display:block;text-align:center}
.page .qh i{display:block;margin-top:6px}
.page .ti{text-align:center;font-weight:700;font-size:16px;margin-top:8px}
.page .su{text-align:center;font-weight:700;margin-bottom:14px}
.page .to{text-align:center;margin-bottom:12px}
.page p{margin:0 0 6px;text-align:justify;text-indent:2em}
.page p.ni{text-indent:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#f4f4f4;padding:6px}
.page h4{font-size:15px;margin:10px 0 4px}
.page ul{margin:0 0 6px;padding-left:2.2em;list-style:"- "}
.page table{border-collapse:collapse;width:100%;font-size:13.5px;margin:6px 0 10px}
.page td,.page th{border:1px solid #888;padding:4px 6px;vertical-align:top}
.page th{background:#dce6f2}
.page .sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;font-size:13px}
.page .sg .r{text-align:center}
.page .sg .r b{display:block}
.page .sg .r .nm{margin-top:56px}
.stamp{position:absolute;right:10%;bottom:90px;transform:rotate(-12deg);border:3px double #c0262d;color:#c0262d;font:800 20px/1 var(--ui);letter-spacing:.12em;padding:8px 14px;border-radius:6px;opacity:.85;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:40;max-width:calc(100% - 32px)}
.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.result div{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px}
.result b{display:block;font:800 24px/1.1 var(--ui)}
.result small{color:var(--ink-2);font-size:12px}
.grade{font:800 64px/1 var(--ui);color:var(--accent);text-align:center}
table.rs{border-collapse:collapse;width:100%;font-size:13px}
table.rs td,table.rs th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.tw{overflow-x:auto}

/* Visual refresh: warm office palette taken from the Ban's room (cream walls, light oak, VATM blue) */
.top{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:10px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#2a74bd,#1b4f86);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
.btn{border-radius:10px;transition:border-color .15s,box-shadow .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#2a74bd,#1f5f9e);box-shadow:0 2px 6px rgba(31,95,158,.3)}
.stage{border-radius:20px;box-shadow:var(--shadow)}
.side .panel{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.side .task,.side .memo{background:var(--paper);border-color:transparent}
.side button.task:hover{border-color:var(--accent);background:var(--sheet)}
.feed{border-radius:16px;box-shadow:var(--shadow)}
.mini{box-shadow:0 0 0 2px var(--sheet),0 0 0 3px var(--line)}
.dlg{border-radius:18px;box-shadow:0 20px 50px rgba(20,20,30,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side .task,:root:not([data-theme="light"]) .side .memo{background:var(--wash)}}
:root[data-theme="dark"] .side .task,:root[data-theme="dark"] .side .memo{background:var(--wash)}

/* ---------- Giao việc bằng tin nhắn ----------

  }

  const plain = hits.filter(h => !(h.n === 1 && /^(anh|chị|em)$/.test(nv(h.s.name).split(' ').pop())));

function chatPush(by, text) { (st.chat = st.chat || []).push({ by, text, time: hhmm(), day: today() }); if (st.chat.length > 80) st.chat.splice(0, st.chat.length - 80); }

let chatBusy = false;
async function chatSend() {
  const box = $('chatIn'), text = box.value.trim(); if (!text || chatBusy) return;
  chatBusy = true; box.value = ''; $('chatGo').disabled = true; chatPush('me', text); renderChat();
  let r;
  try { r = st.aiOn && sample ? await chatAI(text) : chatLocal(text); } catch (e) { r = chatLocal(text); }
  if (r.say) chatPush('sys', r.say);
  else if (r.ask) chatPush('sys', `Anh/chị muốn giao cho ai: ${r.ask.map(s => s.name).join(' hay ')}? Gõ lại tin nhắn kèm họ tên đầy đủ giúp em.`);
  else if (!r.title) chatPush('sys', 'Em chưa rõ việc cần làm. Anh/chị gõ rõ việc và người nhận giúp em.');
  else {
    const s = staffOf(r.who);
    assign({ tpl: null, src: null, title: r.title, desc: r.desc, fmt: r.fmt, effort: 1, due: r.due, from: 'self' }, s.id);
    chatPush(s.id, `Em nhận việc “${r.title}” (${r.fmt === 'xlsx' ? 'file Excel' : 'file Word'}), hạn ${dShort(r.due)} ạ.${r.guessed ? ' Tin nhắn chưa nêu người nhận nên việc được giao cho em theo mảng phụ trách.' : ''}`);
  }

}

function fireStaff(s, to) {
  const t2 = staffOf(to), moved = st.tasks.filter(t => t.who === s.id && t.status !== 'done');
  moved.forEach(t => { t.who = to; });
  st.inbox.forEach(m => { if (m.who === s.id) m.who = null; });
  st.staff = st.staff.filter(x => x !== s); (st.former = st.former || []).push(s);
  st.here = (st.here || []).filter(id => id !== s.id); WALK.delete(s.id);
  st.tasks.forEach(t => {   // drafts this person was to comment on go to another Phó, or straight to the Trưởng ban
    if (t.vetBy !== s.id || t.status === 'done') return;
    const p = phoFor(t); if (p) t.vetBy = p.id; else { t.vetBy = null; t.phoFix = false; if (t.status === 'vetting') t.status = 'review'; }
  });
  log(st.org.manager, `cho ${s.name} (${s.role}) nghỉ việc${moved.length && t2 ? `; ${moved.length} việc đang dở chuyển cho ${t2.name}` : ''}.`, 'warn');
  save(); render(); runQueue();
}
function rehire(id) {
  const s = (st.former || []).find(x => x.id === id); if (!s) return;
  st.former = st.former.filter(x => x !== s); if (s.desk != null && st.staff.some(x => x.desk === s.desk)) s.desk = null;
  const at = STAFF0.findIndex(d => d.id === id), k = st.staff.findIndex(x => STAFF0.findIndex(d => d.id === x.id) > at);

}

/* File preview */
function xlPreview(sh, meta) {
  const { grid, merges } = S.layoutSheet(sh, meta), nC = sh.cols.length, nR = grid.length - 1;
  const span = {}; merges.forEach(m => { const [a, b] = m.split(':'), r = +a.replace(/\D/g, ''), c1 = a.charCodeAt(0) - 65, c2 = b.charCodeAt(0) - 65; span[r + ':' + c1] = c2 - c1 + 1; for (let c = c1 + 1; c <= c2; c++) span[r + ':' + c] = 0; });
  let h = '<table><thead><tr><th class="rn"></th>' + sh.cols.map((_, i) => `<th>${S.colL(i)}</th>`).join('') + '</tr></thead><tbody>';
  for (let r = 1; r <= nR; r++) {
    h += `<tr><th class="rn">${r}</th>`;
    for (let c = 0; c < nC; c++) {
      let sp = span[r + ':' + c]; if (sp === 0) continue;
      const cell = (grid[r] || [])[c]; let cls = '', txt = '';
      if (!sp && cell && !cell.num && String(cell.v).length > 24 && !(grid[r] || []).slice(c + 1).some(Boolean)) { sp = nC - c; c = nC; }
      if (cell) {
        cls = { 1: 'h', 6: 't', 7: 't n', 4: 'ti', 5: 'st', 10: 'b' }[cell.s] || (cell.num ? 'n' : (String(cell.v).length > 40 && cell.s === 2 ? 'w' : ''));
        const v = cell.v; txt = cell.num && v !== '' && !isNaN(Number(v)) ? (cell.s === 8 ? (Number(v) * 100).toFixed(1) + '%' : money(Number(v))) : esc(v);
      }
      const cc = sp && c === nC ? nC - sp : c;
      h += `<td class="${cls}" ${sp ? `colspan="${sp}"` : ''} data-ref="${S.colL(cc)}${r}" data-fx="${cell ? esc(cell.f ? '=' + cell.f : (cell.v ?? '')) : ''}" style="min-width:${Math.round(sh.cols[cc].w * 6.5)}px">${txt}</td>`;
    }
    h += '</tr>';
  }
  return h + '</tbody></table>';
}
function wdPreview(spec, meta) { return spec.tpl ? `<div class="tplPrev">${spec.html || ''}</div>` : S.atclHtml(spec, meta); }
// Letters are signed by the Trưởng ban; a draft by the Phó Trưởng ban is signed "KT. TRƯỞNG BAN / PHÓ TRƯỞNG BAN" as in the Ban's template.
